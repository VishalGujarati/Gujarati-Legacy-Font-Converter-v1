name: Linux DEB release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Build inside Ubuntu 20.04 so the resulting binary has a better
      # chance of running on Ubuntu 20.04 and newer systems.
      - name: Build application in Ubuntu 20.04
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ubuntu:20.04 \
            bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y python3.8 python3.8-venv python3-pip
              python3.8 -m pip install --upgrade "pip<24.1" "setuptools<70" wheel
              python3.8 -m pip install "pyinstaller==5.13.2"
              python3.8 -m PyInstaller --clean --noconfirm build/GujaratiLegacyFontConverter.spec
              chown -R "$(stat -c "%u:%g" /src)" /src/dist
            '

      - name: Package DEB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PKG="gujarati-legacy-font-converter"
          ROOT="deb-root"

          rm -rf "$ROOT"
          mkdir -p \
            "$ROOT/DEBIAN" \
            "$ROOT/opt/$PKG" \
            "$ROOT/usr/bin" \
            "$ROOT/usr/share/applications" \
            "$ROOT/usr/share/icons/hicolor/256x256/apps"

          cp -a dist/GujaratiLegacyFontConverter/. "$ROOT/opt/$PKG/"
          cp assets/software_logo.png "$ROOT/usr/share/icons/hicolor/256x256/apps/$PKG.png"

          cat > "$ROOT/usr/bin/$PKG" <<'LAUNCHER'
          #!/bin/sh
          cd /opt/gujarati-legacy-font-converter
          exec ./GujaratiLegacyFontConverter "$@"
          LAUNCHER
          chmod 0755 "$ROOT/usr/bin/$PKG"

          cat > "$ROOT/usr/share/applications/$PKG.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Gujarati Legacy Font Converter
          Comment=Convert Gujarati legacy-font documents to Unicode
          Exec=/usr/bin/$PKG
          Icon=$PKG
          Terminal=false
          Type=Application
          Categories=Utility;Office;
          DESKTOP

          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: $PKG
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Passion Projects
          Description: Gujarati Legacy Font Converter
           Offline Gujarati legacy-font to Unicode converter for supported Gujarati fonts and documents.
          CONTROL

          cat > "$ROOT/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          fi
          exit 0
          POSTINST
          chmod 0755 "$ROOT/DEBIAN/postinst"

          mkdir -p Output
          dpkg-deb --build --root-owner-group "$ROOT" "Output/GujaratiLegacyFontConverter-${VERSION}-amd64.deb"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd Output
          sha256sum "GujaratiLegacyFontConverter-${VERSION}-amd64.deb" > SHA256SUMS-Linux.txt
          cat SHA256SUMS-Linux.txt

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: GujaratiLegacyFontConverter-${{ github.ref_name }}-Linux-x64
          path: |
            Output/GujaratiLegacyFontConverter-*-amd64.deb
            Output/SHA256SUMS-Linux.txt
